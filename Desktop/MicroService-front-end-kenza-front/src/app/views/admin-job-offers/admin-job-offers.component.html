<div class="p-6">
    <h2 class="text-xl font-bold mb-4">📋 Gestion des Offres</h2>
  
    <form [formGroup]="offerForm" (ngSubmit)="submitOffer()" class="space-y-2 mb-6 bg-gray-100 p-4 rounded">
      <div>
        <input type="text" formControlName="title" placeholder="Titre de l'offre" class="w-full p-2 border rounded" />
      </div>
      <div>
        <textarea formControlName="description" placeholder="Description" class="w-full p-2 border rounded"></textarea>
      </div>
      <div>
        <input type="text" formControlName="location" placeholder="Lieu" class="w-full p-2 border rounded" />
      </div>
      <div>
        <input type="text" formControlName="company" placeholder="Entreprise" class="w-full p-2 border rounded" />
      </div>
      <div>
        <input type="text" formControlName="salary" placeholder="Salaire" class="w-full p-2 border rounded" />
      </div>
      <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded">
        {{ editingOfferId ? 'Mettre à jour' : 'Créer' }}
      </button>
      <button *ngIf="editingOfferId" type="button" (click)="cancelEdit()" class="ml-2 bg-gray-400 text-white px-3 py-2 rounded">
        Annuler
      </button>
    </form>
  
    <div *ngFor="let offer of offers" class="border rounded p-4 mb-4 shadow">
      <h3 class="font-semibold text-lg">{{ offer.title }}</h3>
      <p>{{ offer.description }}</p>
      <p class="text-sm text-gray-500">📍 {{ offer.location }} | 🏢 {{ offer.company }} | 💸 {{ offer.salary }}</p>
  
      <button (click)="editOffer(offer)" class="bg-yellow-500 text-white px-3 py-1 rounded mt-2">✏️ Modifier</button>
      <button (click)="deleteOffer(offer.id)" class="bg-red-600 text-white px-3 py-1 rounded mt-2 ml-2">🗑️ Supprimer</button>
  
      <div *ngIf="offer.applications?.length > 0" class="mt-3 bg-gray-50 p-3 rounded">
        <h4 class="font-semibold mb-2">📄 Candidatures :</h4>
        <ul class="list-disc pl-5 text-sm">
          <li *ngFor="let app of offer.applications">
            👤 {{ app.fullName }} | ✉️ {{ app.email }} |
            <a [href]="app.cvUrl" class="text-blue-600 underline" target="_blank">CV</a>
          </li>
        </ul>
      </div>
    </div>
  </div>
