<!-- Fixed Navbar -->

  
  <!-- Centered Content -->
  <div class="min-h-screen flex items-center justify-center pt-32 px-4 bg-blueGray-50">
    <div class="w-full lg:w-12/12 px-4">
      <form
        [formGroup]="congeForm"
        (ngSubmit)="onSubmit()"
        class="relative flex flex-col min-w-0 break-words w-full mb-6 shadow-lg rounded-lg bg-blueGray-100 border-0"
      >
        <div class="rounded-t bg-white mb-0 px-6 py-6">
          <div class="text-center flex justify-between">
            <h6 class="text-blueGray-700 text-xl font-bold">Leave Request</h6>
            <button
              class="bg-red-600 text-white active:bg-red-700 font-bold uppercase text-xs px-4 py-2 rounded shadow hover:shadow-md outline-none focus:outline-none mr-1 ease-linear transition-all duration-150"
              type="submit"
            >
              Submit
            </button>
          </div>
        </div>
  
        <div class="flex-auto px-4 lg:px-10 py-10 pt-0">
          <h6 class="text-blueGray-400 text-sm mt-3 mb-6 font-bold uppercase">Request Information</h6>
          <div class="flex flex-wrap">
            <!-- Employe ID -->
            <div class="w-full lg:w-3/12 px-4">
              <div class="relative w-full mb-3">
                <label class="block uppercase text-blueGray-600 text-xs font-bold mb-2">Employee ID</label>
                <input
                  type="text"
                  formControlName="employeId"
                  class="border-0 px-3 py-3 placeholder-blueGray-300 text-blueGray-600 bg-white rounded text-sm shadow focus:outline-none focus:ring w-full ease-linear transition-all duration-150"
                  placeholder="Enter your employee ID"
                />
              </div>
            </div>
  
            <!-- Start Date -->
            <div class="w-full lg:w-4/12 px-4">
              <div class="relative w-full mb-3">
                <label class="block uppercase text-blueGray-600 text-xs font-bold mb-2">Start Date</label>
                <input
                  type="date"
                  formControlName="dateDebut"
                  class="border-0 px-3 py-3 placeholder-blueGray-300 text-blueGray-600 bg-white rounded text-sm shadow focus:outline-none focus:ring w-full ease-linear transition-all duration-150"
                />
              </div>
            </div>
  
            <!-- End Date -->
            <div class="w-full lg:w-4/12 px-4">
              <div class="relative w-full mb-3">
                <label class="block uppercase text-blueGray-600 text-xs font-bold mb-2">End Date</label>
                <input
                  type="date"
                  formControlName="dateFin"
                  class="border-0 px-3 py-3 placeholder-blueGray-300 text-blueGray-600 bg-white rounded text-sm shadow focus:outline-none focus:ring w-full ease-linear transition-all duration-150"
                />
              </div>
            </div>
  
            <!-- Motif -->
            <div class="w-full lg:w-12/12 px-4">
              <div class="relative w-full mb-3">
                <label class="block uppercase text-blueGray-600 text-xs font-bold mb-2">Motif</label>
                <textarea
                  rows="3"
                  formControlName="motif"
                  placeholder="Reason for leave"
                  class="border-0 px-3 py-3 placeholder-blueGray-300 text-blueGray-600 bg-white rounded text-sm shadow focus:outline-none focus:ring w-full ease-linear transition-all duration-150"
                ></textarea>
              </div>
            </div>
          </div>
  
          <!-- Response Message -->
          <div class="mt-4 px-4 text-sm font-medium" [ngClass]="isError ? 'text-red-500' : 'text-green-600'" *ngIf="responseMessage">
            {{ responseMessage }}
          </div>
        </div>
      </form>
    </div>
  </div>
