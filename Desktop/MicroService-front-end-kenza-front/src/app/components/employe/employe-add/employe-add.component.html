<div class="container mx-auto p-4">
  <h2 class="text-2xl font-semibold mb-6">Ajouter un Employé</h2>

  <form (ngSubmit)="addEmploye()" class="space-y-6">

    <!-- Name -->
    <div class="form-group">
      <label for="name" class="block text-sm font-medium text-gray-700">Nom</label>
      <input type="text" id="name" [(ngModel)]="employe.name" name="name" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
    </div>

    <!-- Description -->
    <div class="form-group">
      <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
      <input type="text" id="description" [(ngModel)]="employe.description" name="description" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
    </div>

    <!-- Role -->
    <div class="form-group">
      <label for="role" class="block text-sm font-medium text-gray-700">Rôle</label>
      <input type="text" id="role" [(ngModel)]="employe.role" name="role" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
    </div>

    <!-- Grade -->
    <div class="form-group">
      <label for="grade" class="block text-sm font-medium text-gray-700">Grade</label>
      <input type="number" id="grade" [(ngModel)]="employe.grade" name="grade" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
    </div>

    <!-- Submit Button -->
    <button type="submit" class="bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded text-sm font-semibold py-2 px-4 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-50">
      Ajouter
    </button>
  </form>
</div>
