<div class="container mx-auto p-4">
    <h2 class="text-2xl font-bold text-gray-800 mb-4">Liste des Employés</h2>
  
    <div class="flex justify-end mb-4">
      <a class="bg-red-500 hover:bg-green-600 text-white px-4 py-2 rounded"
      routerLink="/admin/add-employe">
        Ajouter un Employé
      </a>
    </div>
  
    <table class="min-w-full bg-white shadow-md rounded">
      <thead class="bg-gray-100">
        <tr>
          <th class="py-2 px-4 border-b">ID</th>
          <th class="py-2 px-4 border-b">Nom</th>
          <th class="py-2 px-4 border-b">Description</th>
          <th class="py-2 px-4 border-b">Rôle</th>
          <th class="py-2 px-4 border-b">Grade</th>
          <th class="py-2 px-4 border-b">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let employe of employes" class="hover:bg-gray-50">
          <td class="py-2 px-4 border-b">{{ employe.id }}</td>
          <td class="py-2 px-4 border-b">{{ employe.name }}</td>
          <td class="py-2 px-4 border-b">{{ employe.description }}</td>
          <td class="py-2 px-4 border-b">{{ employe.role }}</td>
          <td class="py-2 px-4 border-b">{{ employe.grade }}</td>
          <td class="py-2 px-4 border-b space-x-2">
            <a [routerLink]="['/admin/modify-employe', employe.id]" class="bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded text-sm">Modifier</a>
            <button (click)="deleteEmploye(employe.id)" class="bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded text-sm">Supprimer</button>
          </td>
        </tr>
      </tbody>
    </table>
  
    <div *ngIf="employes.length === 0" class="mt-4 p-3 bg-blue-100 text-blue-800 rounded">
      Aucun employé trouvé.
    </div>
  </div>
